services:
  react:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ses-system-react
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - react_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
    command: npm run dev -- --host 0.0.0.0
    networks:
      - ses-system-react-network

volumes:
  react_node_modules:

networks:
  ses-system-react-network:
    driver: bridge