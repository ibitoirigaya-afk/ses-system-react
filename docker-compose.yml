services:
  react:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ses-system-react
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api

volumes:
  node_modules: